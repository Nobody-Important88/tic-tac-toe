<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:black;
  --box:#161616;
  --line:#2a2a2a;
  --main: red;
  --text:#f0f0f0;
  --gray:#888;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

h1{
  font-size:2.4rem;
  font-weight:800;
  margin-bottom:.2rem;
}

h1 span{
  color:var(--main);
}

.sub{
  font-family:'Space Mono',monospace;
  font-size:.72rem;
  color:var(--gray);
  text-transform:uppercase;
  margin-bottom:1.5rem;
}

.scoreboard{
  display:flex;
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:1.5rem;
}

.score{
  background:var(--bg);
  padding:.8rem 1.6rem;
  text-align:center;
  min-width:90px;
}

.score.active{
  background:rgba(180,77,255,.08);
}

.val{
  font-size:1.6rem;
  font-weight:800;
}


.key{
  font-family:'Space Mono',monospace;
  font-size:.62rem;
  color:var(--gray);
  text-transform:uppercase;
}

#status{
  font-family:'Space Mono',monospace;
  font-size:.8rem;
  color:var(--main);
  margin-bottom:1rem;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,100px);
  grid-template-rows:repeat(3,100px);
  gap:4px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:1.5rem;
}

.cell{
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.5rem;
  font-weight:800;
  cursor:pointer;
  user-select:none;
}

button{
  height:40px;
  padding:0 1.5rem;
  border:1px solid var(--main);
  background:none;
  color:var(--main);
  font-family:'Space Mono',monospace;
  font-size:.72rem;
  text-transform:uppercase;
  cursor:pointer;
}

button:hover{
  background:var(--main);
  color:var(--bg);
}
</style>
</head>

<body>

<h1>Tic Tac <span>Toe</span></h1>

<p class="sub">Two player game</p>

<div class="scoreboard">

  <div class="score x" id="xbox">
    <div class="val" id="xs">0</div>
    <div class="key">Player X</div>
  </div>

  <div class="score tie">
    <div class="val" id="ts">0</div>
    <div class="key">Ties</div>
  </div>

  <div class="score o" id="obox">
    <div class="val" id="os">0</div>
    <div class="key">Player O</div>
  </div>

</div>

<p id="status">Player X's turn</p>

<div class="board">

  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>

  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>

  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>

</div>

<button onclick="reset()">New Round</button>

<script>
const wins = [
  [0,1,2],
  [3,4,5],
  [6,7,8],
  [0,3,6],
  [1,4,7],
  [2,5,8],
  [0,4,8],
  [2,4,6]
]

let board = Array(9).fill(null)
let turn = 'X'
let over = false

let score = {
  X:0,
  O:0,
  T:0
}

document.querySelectorAll('.cell').forEach(cell => {

  cell.addEventListener('click', () => {

    const i = +cell.dataset.i

    if(over || board[i]) return

    board[i] = turn
    cell.textContent = turn

    cell.classList.add(
      turn.toLowerCase(),
      'taken'
    )

    const win = wins.find(([a,b,c]) =>
      board[a] &&
      board[a] === board[b] &&
      board[b] === board[c]
    )

    if(win){

      win.forEach(i => {
        document
        .querySelector(`[data-i="${i}"]`)
        .classList.add('win')
      })

      document.getElementById('status').textContent =
      `Player ${turn} wins! 🎉`

      score[turn]++

      document.getElementById(
        turn === 'X' ? 'xs' : 'os'
      ).textContent = score[turn]

      over = true

    } else if(board.every(Boolean)) {

      document.getElementById('status').textContent =
      "It's a tie!"

      score.T++

      document.getElementById('ts').textContent =
      score.T

      over = true

    } else {

      turn = turn === 'X' ? 'O' : 'X'

      document.getElementById('status').textContent =
      `Player ${turn}'s turn`

      document.getElementById('xbox')
      .classList.toggle('active', turn === 'X')

      document.getElementById('obox')
      .classList.toggle('active', turn === 'O')
    }
  })
})

function reset(){

  board = Array(9).fill(null)

  turn = 'X'
  over = false

  document.querySelectorAll('.cell').forEach(c => {
    c.textContent = ''
    c.className = 'cell'
  })

  document.getElementById('status').textContent =
  "Player X's turn"

  document.getElementById('xbox')
  .classList.add('active')

  document.getElementById('obox')
  .classList.remove('active')
}

reset()
</script>

</body>
</html>
